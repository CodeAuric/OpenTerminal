services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "4000:4000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - API_KEY=${API_KEY:-}
      - API_HOST=0.0.0.0
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:3000}
      - DATA_DIR=/app/data
      - TRUST_PROXY=${TRUST_PROXY:-}
    volumes:
      - terminal-data:/app/data
    restart: unless-stopped
    networks:
      - dokploy-network   # <--- Conectado a la red de Dokploy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "4001:3000"
    environment:
      - API_URL=http://api:4000
      - API_KEY=${API_KEY:-}
      - API_KEY_FILE=/app/data/.api-key
    volumes:
      - terminal-data:/app/data:ro
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - dokploy-network   # <--- Conectado a la red de Dokploy

volumes:
  terminal-data:

networks:
  dokploy-network:
    external: true        # <--- Le indicamos a Docker que es una red preexistente creada por Dokploy
